<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Dry Fruit Basket</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/grid.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" type="image/svg+xml" href="../assets/img/dry-fruits-logo.svg">
</head>

<body>
    <script>window.ROOT = "../";</script>

    <header id="site-header"></header>

    <section class="breadcrumb-section">
        <div class="container d-flex align-items-center justify-content-between flex-wrap">
            <div class="breadcrumb-title"><h1>Create Account</h1></div>
            <ul class="breadcrumb">
                <li><a href="../index.html">Home</a></li>
                <li class="active">Sign Up</li>
            </ul>
        </div>
    </section>

    <section class="container">
        <div class="auth-wrap">
            <h1>Create Your Account</h1>
            <p class="auth-subtitle">Join Dry Fruit Basket for faster checkout and order tracking.</p>

            <div class="form-error-banner js-form-error" hidden></div>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="signup-name">Full Name <span class="required">*</span></label>
                    <input type="text" id="signup-name" class="form-control" placeholder="Your full name" required autocomplete="name">
                    <span class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address <span class="required">*</span></label>
                    <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
                    <span class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" class="form-control" placeholder="Optional" autocomplete="tel">
                    <span class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password <span class="required">*</span></label>
                    <div class="password-field">
                        <input type="password" id="signup-password" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
                    </div>
                    <span class="js-password-strength password-strength"></span>
                    <span class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="signup-confirm" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
                    <span class="field-error"></span>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="signup-terms">
                    <label for="signup-terms">I agree to the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.</label>
                </div>

                <button type="submit" class="theme-btn theme-btn-solid auth-submit">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </section>

    <footer id="site-footer"></footer>

    <script src="../assets/js/data/products.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/search.js"></script>
    <script src="../assets/js/carousel.js"></script>
    <script src="../assets/js/product-card.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/pages/signup.js"></script>
</body>

</html>
